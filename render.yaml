services:
  # Full-Stack Web Service (Runs Express and serves the Vite React frontend statically)
  - type: web
    name: truthshield-fullstack
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set this to your live MongoDB Atlas connection string in Render Dashboard
